name: docker-build-and-push

on:
    push:
        branches: [master]

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        steps:

            - name: code checkout
              uses: actions/checkout@v4

            - name: login to docker hub
              uses: docker/login-action@v3
              with:
                username: ${{vars.DOCKERHUB_USER1}}
                password: ${{secrets.DOCKERHUB_TOKEN1}}

            - name: build and push to docker hub
              uses: docker/build-push-action@v6
              with:
                context: .
                push: true
                tags: | 
                    ${{vars.DOCKERHUB_USER}}/github-actions-app:${{github.GITHUB_HEAD_REF}}    
                    ${{vars.DOCKERHUB_USER}}/github-actions-app:latest   
                    ${{vars.DOCKERHUB_USER}}/github-actions-app:${{github.GITHUB_SHA}}





            
